[package]
name = "ai_diagnostic_rs"
version = "2.0.0"
edition = "2021"
description = "AI Control Failure Diagnostic Framework — Bayesian diagnostic tool for classifying AI anomalous behavior into five failure classes"
license = "MIT"

[lib]
name = "ai_diagnostic_rs"
path = "src/lib.rs"

[[bin]]
name = "ai_diagnostic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "2", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
